<!DOCTYPE html><html lang="hu"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kollégiumi jelentkezési lap</title><style>@page{size:A4;margin:14mm 15mm}*{box-sizing:border-box}body{margin:0;background:#e9edf2;font:11pt Arial;color:#111}.toolbar{position:sticky;top:0;padding:12px;background:#17365d;color:white;display:flex;gap:10px;align-items:center}.toolbar button{border:0;border-radius:5px;padding:9px 14px;font-weight:bold;cursor:pointer}.primary{background:#2e75b6;color:white}.status{margin-left:auto}main{width:210mm;min-height:297mm;margin:18px auto;padding:14mm 15mm;background:white;box-shadow:0 0 8px #999}h1,h2{text-align:center;margin:4px}h1{font-size:16pt}h2{font-size:13pt;margin-bottom:20px}.notice{text-align:center;font-weight:bold;margin-bottom:20px}.row{display:flex;gap:8px;align-items:baseline;margin:10px 0}label{font-weight:bold;white-space:nowrap}input{border:0;border-bottom:1px solid #333;padding:3px;font:inherit;background:transparent;min-width:0}.grow{flex:1;width:100%}.half{flex:1}.declaration{line-height:1.45;margin-top:25px}.date-sign{display:flex;justify-content:space-between;align-items:end;margin-top:35px}.sign{text-align:center;width:42%}.line{border-bottom:1px solid;height:25px}.small{font-size:9pt}@media print{body{background:white;font-size:10.5pt}.toolbar{display:none}main{margin:0;padding:0;width:auto;box-shadow:none}}</style></head><body><div class="toolbar"><button class="primary" onclick="window.print()">Nyomtatás</button><button class="primary" id="submitBtn" onclick="submitToGoogle()">BEKÜLDÉS</button><span class="status" id="status"></span></div><main><h1>KOLLÉGIUMI JELENTKEZÉSI LAP</h1><h2>2026/2027.</h2><div class="notice">Kérjük minden adatot töltsenek ki!</div><div class="row"><label>A gyermek neve (születési anyakönyvi kivonat alapján):</label><input class="grow" name="childName" type="text"></div><div class="row"><label>Osztálya (2026/2027):</label><input class="grow" name="className" type="text"></div><div class="row"><label>Születési helye, ideje:</label><input class="grow" name="birth" type="text"></div><div class="row"><label>Lakcíme:</label><input class="grow" name="address" type="text"></div><div class="row"><label>Lakcím telefonja:</label><input class="grow" name="addressPhone" type="text"></div><div class="row"><label>Állampolgársága:</label><input class="grow" name="citizenship" type="text"></div><div class="row"><label>TAJ száma:</label><input class="grow" name="taj" type="text"></div><div class="row"><label>Oktatási azonosító száma:</label><input class="grow" name="eduId" type="text"></div><div class="row"><label>Az apa/gondviselő neve:</label><input class="grow" name="father" type="text"></div><div class="row"><label>Telefonszáma:</label><input class="half" name="fatherPhone" type="text"><label>e-mail:</label><input class="half" name="fatherEmail" type="text"></div><div class="row"><label>Az anya leánykori neve:</label><input class="grow" name="mother" type="text"></div><div class="row"><label>Telefonszáma:</label><input class="half" name="motherPhone" type="text"><label>e-mail:</label><input class="half" name="motherEmail" type="text"></div><p class="declaration">Alulírott <input name="applicant" style="width:40%" type="text"> szülő kérem, hogy gyermekem kollégiumi elhelyezését a 2026/2027-es tanévre.</p><div class="date-sign"><div>Dátum: <input name="date" style="width:150px" type="text"></div><div class="sign"><div class="line"></div><div class="small">aláírás</div></div></div></main><script>const GOOGLE_SCRIPT_URL='https://script.google.com/macros/s/XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX/exec';function data(){let d={};document.querySelectorAll('input,textarea,select').forEach((e,i)=>d[e.name||'control_'+i]=e.value);return d}async function submitToGoogle(){let b=document.getElementById('submitBtn'),s=document.getElementById('status');b.disabled=true;b.textContent='Küldés...';try{await fetch(GOOGLE_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(data())});s.textContent='Sikeres beküldés';alert('Az adatlap elküldve.')}catch(e){s.textContent='Hiba';alert('Hiba történt a beküldés során.')}finally{b.disabled=false;b.textContent='BEKÜLDÉS'}}</script></body></html>
