<!DOCTYPE html><html lang="hu"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nyilatkozat életvitelszerű együttélésről</title><style>@page{size:A4;margin:14mm 15mm}*{box-sizing:border-box}body{margin:0;background:#e9edf2;font:11pt Arial;color:#111}.toolbar{position:sticky;top:0;padding:12px;background:#17365d;color:#fff;display:flex;gap:10px;align-items:center}.toolbar button{border:0;border-radius:5px;padding:9px 14px;font-weight:bold;cursor:pointer}.primary{background:#2e75b6;color:#fff}.status{margin-left:auto}main{width:210mm;min-height:297mm;margin:18px auto;padding:14mm 15mm;background:#fff;box-shadow:0 0 8px #999}.top{text-align:right;font-size:9pt}h1{text-align:center;font-size:17pt;margin:45px 0 30px}.line{display:flex;gap:8px;align-items:baseline;margin:16px 0}label{font-weight:bold}input{flex:1;border:0;border-bottom:1px solid #333;padding:3px;font:inherit;background:transparent}.statement{margin-top:28px;line-height:1.6}.date-sign{display:flex;justify-content:space-between;align-items:end;margin-top:55px}.sign{text-align:center;width:42%}.signline{border-bottom:1px solid;height:25px}@media print{body{background:#fff}.toolbar{display:none}main{margin:0;padding:0;width:auto;box-shadow:none}}</style></head><body><div class="toolbar"><button class="primary" onclick="window.print()">Nyomtatás</button><button class="primary" id="submitBtn" onclick="submitToGoogle()">BEKÜLDÉS</button><span class="status" id="status"></span></div><main><div class="top">1. számú melléklet</div><h1>NYILATKOZAT</h1><div class="line"><label>Név:</label><input name="parentName" type="text"></div><div class="line"><label>Születési hely, idő:</label><input name="parentBirth" type="text"></div><div class="line"><label>Lakóhely:</label><input name="residence" type="text"></div><div class="line"><label>Tartózkodási hely:</label><input name="temporaryResidence" type="text"></div><p class="statement">Kijelentem, hogy gyermekemmel:</p><div class="line"><label>Név:</label><input name="childName" type="text"></div><div class="line"><label>Születési hely, idő:</label><input name="childBirth" type="text"></div><p class="statement">életvitelszerűen <input name="livingAddress" style="width:55%" type="text"> címen élek.</p><div class="date-sign"><div>Szeged, 2026 <input name="date" style="width:120px" type="text"> hó <input name="day" style="width:45px" type="text"></div><div class="sign"><div class="signline"></div>Aláírás</div></div></main><script>const GOOGLE_SCRIPT_URL='https://script.google.com/macros/s/XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX/exec';function data(){let d={};document.querySelectorAll('input,textarea,select').forEach((e,i)=>d[e.name||'control_'+i]=e.value);return d}async function submitToGoogle(){let b=document.getElementById('submitBtn'),s=document.getElementById('status');b.disabled=true;b.textContent='Küldés...';try{await fetch(GOOGLE_SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify(data())});s.textContent='Sikeres beküldés';alert('A nyilatkozat elküldve.')}catch(e){s.textContent='Hiba';alert('Hiba történt a beküldés során.')}finally{b.disabled=false;b.textContent='BEKÜLDÉS'}}</script></body></html>
